<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Tempo no X</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="title">Tempo no X.com</div>
        <div class="hint">Cronômetro dias · horas · minutos · segundos</div>
      </header>
      <main>
        <div class="timer" id="timer">0d 0h 0m 0s</div>
        <div class="state" id="state">Aguardando abas do X.</div>
      </main>
      <footer>
        <button id="reset">Zerar</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
